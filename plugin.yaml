name: openrouter_custom
kind: model-provider
version: 0.7.15
description: |
  OpenRouter live-catalog filter with stable pseudo-model alias.
  Periodically fetches /api/v1/models, filters by free/context/tools/modality,
  ranks candidates and masks the current best under a fixed user-defined name.
author: nnnet/AiManager
repo: https://github.com/nnnet/hermes-plugin-openrouter-custom

# User-tunable parameters. Web UI / operator may rewrite this file in place
# at runtime — the refresh script and on_session_start hook re-read it on
# every invocation, so changes apply at the next cron tick / next session
# without restart.
config:
  # Stable pseudo-name shown in /model picker. The on_session_start hook
  # substitutes this with the currently-chosen real OR model id at session
  # boundaries. Real OR ids that pass the filters are listed alongside, so
  # the operator can either pin a specific id or always ride the alias.
  pseudo_model_alias: best-free

  # Filters — model must pass all of these to enter the candidate pool.
  filters:
    # USD per **million tokens**. Default 0/0 = free-only. Set a budget
    # (e.g. prompt_max: 0.5) to also surface near-free paid tiers.
    price:
      prompt_max: 0
      completion_max: 0
    min_context: 65536           # context_length must be >= this
    require_tools: true          # supported_parameters must contain "tools"
    modality: text               # text | text+image | any
    exclude_patterns:            # regex blacklist matched against model id
      - ^openrouter/auto$        # platform-routed wildcard, not a real free model
    # regex boost during ranking — left empty by default so the operator
    # starts from a neutral pool; the dashboard shows the historical
    # defaults (qwen3, llama-3\.3, deepseek, kimi-k2) as a placeholder.
    prefer_patterns: []

  # Ranking — first by primary, then tiebreakers in order.
  ranking:
    rank_by: prefer_match        # matches prefer_patterns regex first
    tiebreakers:                 # applied in order after primary
      - context_desc             # larger context first
      - params_desc              # larger model wins (more B)
      - modality_pref            # text+image > text
      - tools_count              # more supported_parameters first

  # Rotation — how the OR-native ``models:[...]`` list is composed.
  #
  #   static                 — strict ranking order (current behavior).
  #   failover_with_health   — skip models with OPEN circuit (cooldown).
  #   circuit_breaker        — failover + promote HALF_OPEN to probe slot.
  #   sticky_health_weighted — re-rank by ``rank_score * success_rate``.
  #
  # All non-static modes consult ``state/openrouter_custom/health.json``
  # which is populated by the openrouter-custom-probe cron (default 10m)
  # and, in a future patch, by live observation of conversation outcomes.
  rotation_mode: circuit_breaker

  # Refresh schedule for the cron job that picks the best candidate.
  refresh:
    cron_minutes: 30
    on_failure: keep_last        # keep_last | rotate | fallback_static
    # Used only when ``on_failure: fallback_static`` is selected. Empty
    # by default — operator pastes the real OR id (or rides the dashboard
    # placeholder hint ``qwen/qwen3-coder:free``).
    fallback_static_id: ""

  # Optional cap on number of candidates kept in state file.
  max_candidates: 10

  # Internal sequential fallback within OpenRouter (only when the request
  # uses the pseudo alias above — direct picks of a concrete free model
  # are never wrapped). Implemented via OR's native ``models: [...]``
  # request-body parameter: OR tries them in order on its side and only
  # surfaces a hard failure to us when every candidate refuses.
  #
  # sequential_count = 1 means the current behaviour (just send the top
  # candidate; OR uses its single-model code path).  Setting it to N > 1
  # tells OR to fall through to the next N-1 candidates from our ranked
  # pool when the primary returns 4xx/5xx/timeout. Hermes's external
  # fallback chain (e.g. claude-haiku-4-5) only triggers when the entire
  # internal pool is exhausted.
  #
  # Note: OR's native fallback fires only on transport-level failures
  # (HTTP error, no key, model offline). A 200 OK whose content is a
  # content-level refusal ("I can't help with that") is success from OR's
  # perspective and is NOT retried. Detecting that requires a separate
  # in-plugin proxy and is out of scope here.
  internal_fallback:
    sequential_count: 4

  # Probe — periodic 1-token pings to every top-K candidate that drive
  # the rotation strategies' health data. Disable when the system is
  # not using the alias (no session is being routed through rotation —
  # probes would burn free-tier quota for nothing). UI toggles this
  # under the Rotation card.
  probe_enabled: true

  # Per-call HTTP timeout for probe requests. Free-tier upstreams may
  # take several seconds to respond — keep this short enough that a
  # dead upstream doesn't block the dashboard UI for the full probe
  # pass, but long enough to accommodate a slow-but-responsive provider.
  probe_timeout_seconds: 8
  # OpenAI SDK retries are turned off — single-probe semantics. Raise
  # to a small N if you accept the extra latency for transient retries.
  probe_max_retries: 0
  # Random pause between successive probes in a full pass. Light jitter
  # avoids slamming OpenRouter free-tier with 10 simultaneous requests
  # (which itself trips rate limits and pollutes the health signal).
  probe_jitter_min_seconds: 0.5
  probe_jitter_max_seconds: 1.5
  # Auto-tune: when fewer than this fraction of the top-N probes succeed,
  # trigger an immediate refresh of state.json so the next ranking can
  # incorporate freshly-promoted candidates from the OR catalog.
  probe_auto_tune_top_n: 4
  probe_auto_tune_success_rate: 0.5
  # Minimal payload sent in each probe — keep tiny to avoid free-tier
  # token-budget churn.
  probe_prompt: "ping"
  probe_max_tokens: 1
  probe_temperature: 0.0
  # Override the OpenRouter base URL when proxying through a corporate
  # gateway (leave empty/null to use the default
  # https://openrouter.ai/api/v1).
  probe_base_url: null

  # Quarantine — health-tracking policy applied by record_failure.
  # consecutive_fail_threshold: how many in-a-row failures before a
  # model gets pushed to the tail of rotation. Raise for noisier
  # upstreams, lower for stricter pools.
  quarantine_consecutive_fail_threshold: 3
  # Backoff ladder in MINUTES — successive quarantine durations after
  # each re-failed probe. After the last entry the duration caps.
  quarantine_backoff_minutes: [5, 10, 20, 40, 80]

  # In-memory alias-session cache (persisted to alias_sessions.json).
  # Caps disk growth — raise for high-traffic deployments where many
  # parallel sessions hit the alias path.
  alias_sessions_max: 500

  # Beta-smoothing prior count for ``success_rate`` (sticky_health_weighted
  # ranking). Bigger = newcomers anchored closer to 50% for longer.
  health_success_rate_smoothing: 1

